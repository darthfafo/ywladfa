  <meta property="og:description" content="El juego histórico de la colonia galesa en Chubut. 1865: desembarcás con los colonos en la costa y tenés que sobrevivir. Para jugar en el celu.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fuente retro para título/menús/diálogos (ver util/text.ts, RETRO_FONT) —
       necesita internet la primera vez; si no carga, cae en el monoespaciado de
       siempre (font-family con fallback). -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      height: 100dvh; /* la altura real visible: 100% en mobile cuenta la barra del navegador aunque esté tapando */
      background: #0E1416; color: #EAE8E0;
      overflow: hidden; overscroll-behavior: none;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    body { display: grid; place-items: center; }
    #game { width: 100%; height: 100%; }
    #game canvas {
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: block;
      /* Phaser (pixelArt:true) deja el canvas en "pixelated" — perfecto para el
         mapa/personajes, pero el texto (que ya se renderiza aparte, suavizado,
         ver util/text.ts) se reescala CON el resto del canvas a la pantalla real
         y termina viéndose en bloques. "auto" (bilinear) prioriza que el texto se
         lea bien; a la densidad de píxeles de un celular la diferencia en el arte
         de mapa es mínima (mismo razonamiento que ya usa util/scale.ts para el DPR). */
      image-rendering: auto !important;
    }

    /* Pantalla de espera puro HTML/CSS, sin depender de que cargue nada de JS ni de
       Phaser: cubre TODO el hueco entre "se abrió la página" y "BootScene.create()
       ya corrió" (que en Phaser espera a que termine de bajar TODO lo que pide
       preload() — retratos, escenas, props, varios MB la primera vez sin caché). Sin
       esto esa espera era una pantalla negra lisa sin ningún indicio de que algo
       estaba pasando — en una conexión de celular lenta se lee como que se colgó.
       BootScene.create() la saca (ver ese archivo) apenas el juego está listo. */
    #boot-loading {
      position: fixed; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px;
      background: #0E1416; color: #EAE8E0;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    #boot-loading .bl-title { font-size: 20px; letter-spacing: 2px; }
    #boot-loading .bl-spinner {
      width: 22px; height: 22px;
      border: 2px solid #2E464F; border-top-color: #D9A845;
      border-radius: 50%;
      animation: bl-spin 0.8s linear infinite;
    }
    #boot-loading .bl-text { font-size: 11px; color: #9BAEB4; }
    @keyframes bl-spin { to { transform: rotate(360deg); } }

    /* cursor "›" de las opciones de diálogo (ver DialogueBox.renderChoices): titila
       para que se note que es un selector y no parte del texto — con animation:
       step-end (no la duración entera) el salto es instantáneo, sin fundido, mismo
       criterio pixel-art que el resto del juego. */
    @keyframes dlg-cursor-blink { 50% { opacity: 0; } }

    /* El juego es 9:16 fijo (GDD §2): en horizontal se tapa todo con este aviso. */
    #rotate-guard {
      display: none;
      position: fixed; inset: 0; z-index: 1000;
      background: #0E1416; color: #EAE8E0;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; text-align: center; padding: 24px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    #rotate-guard .icono { font-size: 32px; }
    #rotate-guard .titulo { font-size: 14px; color: #D9A845; }
    #rotate-guard .cuerpo { font-size: 11px; color: #9BAEB4; max-width: 220px; }
    /* Solo en dispositivos táctiles sin mouse: en desktop una ventana ancha
       también matchea "landscape" y no queremos tapar el juego ahí. */
    @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
      #rotate-guard { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot-loading">
    <div class="bl-title">CHUBUT 1865</div>
    <div class="bl-spinner"></div>
    <div class="bl-text">Cargando…</div>
  </div>
  <div id="rotate-guard">
    <div class="icono">↻</div>
    <div class="titulo">Girá el teléfono</div>
    <div class="cuerpo">Chubut 1865 se juega en vertical.</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
