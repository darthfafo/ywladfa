<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Y Wladfa — prueba 3D de la playa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0e1416; overflow: hidden; touch-action: none; }
    body { display: flex; align-items: center; justify-content: center; font-family: "Press Start 2P", ui-monospace, monospace; }
    #frame { position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; overflow: hidden; background: #000; }
    #frame canvas { display: block; width: 100%; height: 100%; }
    .hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px; background: rgba(24, 38, 42, 0.92);
      color: #D9A845; font-size: 11px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .hud .sub { color: #7FB0B8; font-size: 9px; }
    .turns { position: absolute; top: 44px; left: 8px; right: 8px; display: flex; gap: 4px; }
    .turns button, .fx { flex: 1; font: 8px "Press Start 2P", monospace; padding: 6px 2px; color: #EAE8E0;
      background: rgba(24, 38, 42, 0.85); border: 1px solid rgba(127, 176, 184, 0.4); cursor: pointer; }
    .turns button.on { color: #18262A; background: #D9A845; border-color: #D9A845; }
    .fx { position: absolute; right: 8px; top: 74px; flex: none; padding: 6px 8px; }
    .fps { position: absolute; left: 8px; top: 78px; color: #7FB0B8; font-size: 8px; pointer-events: none; }
    .tray { position: absolute; left: 0; right: 0; bottom: 0; min-height: 70px; padding: 10px 12px; box-sizing: border-box;
      background: rgba(24, 38, 42, 0.95); border-top: 1px solid #2E464F; color: #EAE8E0; font-size: 9px; line-height: 1.6; }
    .tray .name { color: #D9A845; margin-bottom: 4px; }
    .act { position: absolute; right: 12px; bottom: 84px; font: 10px "Press Start 2P", monospace; color: #EAE8E0;
      background: rgba(24, 38, 42, 0.9); border: 1px solid #7FB0B8; border-radius: 18px; padding: 10px 14px; display: none; }
    .stick { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 1px solid rgba(234, 232, 224, 0.35);
      background: rgba(24, 38, 42, 0.35); display: none; pointer-events: none; transform: translate(-50%, -50%); }
    .stick i { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
      background: rgba(234, 232, 224, 0.5); }
  </style>
</head>
<body>
  <div id="frame">
    <div class="hud"><span>JORNADA 1 · <span id="turnLabel">AMANECER</span></span><span class="sub" id="cajones">CAJONES 0 / 8</span></div>
    <div class="turns" id="turns"></div>
    <button class="fx" id="fx">FX: SÍ</button>
    <div class="fps" id="fps"></div>
    <button class="act" id="act">LEVANTAR</button>
    <div class="stick" id="stick"><i></i></div>
    <div class="tray" id="tray"><div class="name">PRUEBA 3D</div>Caminá con WASD / flechas o arrastrando. E o el botón para interactuar.</div>
  </div>
  <script type="module" src="/src/poc3d/main.ts"></script>
</body>
</html>
